<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cogniti</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@200;300&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      width: 100vw; height: 100vh;
      background: #0b0d09;
      display: flex; align-items: center; justify-content: center;
      overflow: hidden;
      cursor: pointer;
    }

    #stage {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
    }

    #brand {
      display: flex;
      align-items: center;
      line-height: 1;
    }

    .bl {
      font-family: 'Inter', sans-serif;
      font-weight: 200;
      font-size: 88px;
      letter-spacing: 0.15em;
      color: #d5d1c6;
      line-height: 1;
      display: inline-block;
      opacity: 0;
      transform: translateY(10px);
      will-change: transform, opacity;
    }

    /* O is invisible placeholder — ring takes its place visually */
    #lo {
      color: transparent;
      transform: none;
    }

    #tagline {
      font-family: 'Inter', sans-serif;
      font-weight: 300;
      font-size: 13px;
      letter-spacing: 0.38em;
      color: #4a6030;
      text-transform: uppercase;
      opacity: 0;
      transform: translateY(6px);
    }

    /* Ring — fixed overlay, centered */
    #ring-wrap {
      position: fixed;
      left: 50%; top: 50%;
      transform: translate(-50%, -50%) scale(0.8);
      opacity: 0;
      will-change: transform, opacity;
      pointer-events: none;
      z-index: 100;
    }

    #ring-svg {
      display: block;
      transform: rotate(-90deg);
      overflow: visible;
    }

    .rt { fill: none; stroke: #1c2714; stroke-width: 10; }
    .rp { fill: none; stroke: #567530; stroke-width: 10; stroke-linecap: butt; }
  </style>
</head>
<body>

  <div id="stage">
    <div id="brand">
      <span class="bl" id="lc">C</span>
      <span class="bl" id="lo">O</span>
      <span class="bl" id="lg">G</span>
      <span class="bl" id="ln">N</span>
      <span class="bl" id="li1">I</span>
      <span class="bl" id="lt">T</span>
      <span class="bl" id="li2">I</span>
    </div>
    <div id="tagline">intelligence, designed.</div>
  </div>

  <div id="ring-wrap">
    <svg id="ring-svg" width="180" height="180" viewBox="0 0 180 180">
      <defs>
        <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
          <feGaussianBlur stdDeviation="3.5" result="b"/>
          <feMerge>
            <feMergeNode in="b"/>
            <feMergeNode in="SourceGraphic"/>
          </feMerge>
        </filter>
      </defs>
      <circle class="rt" cx="90" cy="90" r="74"/>
      <circle class="rp" id="rp" cx="90" cy="90" r="74" filter="url(#glow)"/>
    </svg>
  </div>

  <script>
    const rp      = document.getElementById('rp');
    const rw      = document.getElementById('ring-wrap');
    const lo      = document.getElementById('lo');
    const tagline = document.getElementById('tagline');
    const allBl   = [...document.querySelectorAll('.bl')];
    const letters = allBl.filter(l => l !== lo);

    const R = 74, SW = 10;
    const C = +(2 * Math.PI * R).toFixed(3);

    rp.style.strokeDasharray  = C;
    rp.style.strokeDashoffset = C;

    // Measure O position after fonts load (accurate glyph metrics)
    let cachedRect = null;
    document.fonts.ready.then(() => {
      cachedRect = lo.getBoundingClientRect();
    });

    let timers = [];
    const T = (fn, ms) => { const id = setTimeout(fn, ms); timers.push(id); return id; };

    function run() {

      /* Phase 1 — ring appears (bounce-in) */
      T(() => {
        rw.style.transition = 'opacity 0.5s ease, transform 0.7s cubic-bezier(0.34,1.56,0.64,1)';
        rw.style.opacity    = '1';
        rw.style.transform  = 'translate(-50%,-50%) scale(1)';
      }, 200);

      /* Phase 1b — circular sweep fills ring */
      T(() => {
        rp.style.transition       = 'stroke-dashoffset 1.9s cubic-bezier(0.25,0.46,0.45,0.94)';
        rp.style.strokeDashoffset = '0';
      }, 500);

      /* Phase 2 — zoom in on ring (scale up) */
      T(() => {
        rw.style.transition = 'transform 0.7s cubic-bezier(0.4,0,0.2,1)';
        rw.style.transform  = 'translate(-50%,-50%) scale(1.85)';
      }, 2500);

      /* Phase 3 — zoom out: ring glides to O position */
      T(() => {
        const r   = cachedRect || lo.getBoundingClientRect();
        const oCX = r.left + r.width  / 2;
        const oCY = r.top  + r.height / 2;
        const dx  = oCX - window.innerWidth  / 2;
        const dy  = oCY - window.innerHeight / 2;

        // Scale so ring outer diameter matches cap-height of the O glyph (~72% of font-size)
        const capH = r.height * 0.72;
        const sc   = capH / ((R + SW / 2) * 2); // outer diameter = (74+5)*2 = 158px

        rw.style.transition = 'transform 0.9s cubic-bezier(0.4,0,0.2,1)';
        rw.style.transform  = `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px)) scale(${sc})`;
      }, 3400);

      /* Phase 4 — letters cascade in left-to-right (after ring lands) */
      T(() => {
        letters.forEach((l, i) => {
          T(() => {
            l.style.transition = 'opacity 0.55s ease, transform 0.55s cubic-bezier(0.4,0,0.2,1)';
            l.style.opacity    = '1';
            l.style.transform  = 'translateY(0)';
          }, i * 75);
        });
      }, 4400);

      /* Phase 5 — tagline fades in */
      T(() => {
        tagline.style.transition = 'opacity 0.9s ease, transform 0.9s ease';
        tagline.style.opacity    = '1';
        tagline.style.transform  = 'translateY(0)';
      }, 5200);
    }

    function reset() {
      timers.forEach(clearTimeout);
      timers = [];

      rp.style.transition       = 'none';
      rp.style.strokeDashoffset = C;

      rw.style.transition = 'none';
      rw.style.opacity    = '0';
      rw.style.transform  = 'translate(-50%,-50%) scale(0.8)';

      allBl.forEach(l => {
        l.style.transition = 'none';
        l.style.opacity    = '0';
        if (l !== lo) l.style.transform = 'translateY(10px)';
      });

      tagline.style.transition = 'none';
      tagline.style.opacity    = '0';
      tagline.style.transform  = 'translateY(6px)';

      setTimeout(run, 80);
    }

    // Click anywhere to replay
    document.body.addEventListener('click', reset);

    run();
  </script>
</body>
</html>
