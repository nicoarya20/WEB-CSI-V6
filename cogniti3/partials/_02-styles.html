<style>
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --bg:        #060807;
  --surface:   #0c150a;
  --grid-line: #182413;
  --accent:    #b8ff3c;
  --accent2:   #00d4ff;
  --accent-dim:#4a7a10;
  --text:      #edeae2;
  --muted:     #6a7864;
  --handle:    #ff6b35;
  --red:       #c0392b;
}

html, body {
  width: 100%; height: 100%;
  background: var(--bg);
  color: var(--text);
  overflow: hidden;
  cursor: none;
  font-family: 'Space Grotesk', sans-serif;
}

/* ─── cursor ─── */
#cursor {
  position: fixed;
  width: 6px; height: 6px;
  background: var(--accent);
  border-radius: 50%;
  pointer-events: none;
  z-index: 9999;
  transform: translate(-50%, -50%);
  mix-blend-mode: exclusion;
  transition: width .15s, height .15s;
}
#cursor-ring {
  position: fixed;
  width: 28px; height: 28px;
  border: 1px solid rgba(184,255,60,.3);
  border-radius: 50%;
  pointer-events: none;
  z-index: 9998;
  transform: translate(-50%, -50%);
  transition: left .08s linear, top .08s linear;
}

/* ─── scanlines ─── */
#scanlines {
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 8000;
  background: repeating-linear-gradient(
    to bottom,
    transparent 0px,
    transparent 3px,
    rgba(0,0,0,.08) 3px,
    rgba(0,0,0,.08) 4px
  );
  opacity: .5;
}

/* ─── particle canvas ─── */
#particle-canvas {
  position: fixed;
  inset: 0;
  z-index: 1;
  opacity: 0;
  transition: opacity 1s ease;
}

/* ══════════════════════════════
   PHASE 1 — logo intro
══════════════════════════════ */
#phase1 {
  position: fixed;
  inset: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 20px;
  z-index: 500;
  background: var(--bg);
}

#brand {
  display: flex;
  align-items: center;
  line-height: 1;
}
.bl {
  font-family: 'Inter', sans-serif;
  font-weight: 200;
  font-size: 88px;
  letter-spacing: 0.15em;
  color: #d5d1c6;
  line-height: 1;
  display: inline-block;
  opacity: 0;
  transform: translateY(10px);
  will-change: transform, opacity;
}
#lo { color: transparent; transform: none; }

#tagline {
  font-family: 'Inter', sans-serif;
  font-weight: 300;
  font-size: 13px;
  letter-spacing: 0.38em;
  color: var(--accent-dim);
  text-transform: uppercase;
  opacity: 0;
  transform: translateY(6px);
}

/* progress bar during logo reveal */
#progress-bar {
  position: fixed;
  bottom: 0; left: 0;
  height: 1px;
  width: 0%;
  background: linear-gradient(90deg, var(--accent-dim), var(--accent));
  z-index: 600;
  transition: width 5.8s cubic-bezier(0.25, 0.46, 0.45, 0.94);
}

/* terminal readout */
#terminal {
  position: fixed;
  bottom: 32px;
  left: 40px;
  z-index: 600;
  opacity: 0;
  font-family: 'Space Mono', monospace;
  font-size: 9px;
  color: var(--accent-dim);
  letter-spacing: .08em;
  line-height: 1.8;
}

/* ring */
#ring-wrap {
  position: fixed;
  left: 50%; top: 50%;
  transform: translate(-50%, -50%) scale(0.8);
  opacity: 0;
  will-change: transform, opacity;
  pointer-events: none;
  z-index: 510;
}
#ring-svg {
  display: block;
  transform: rotate(-90deg);
  overflow: visible;
}
.rt { fill: none; stroke: #1a2a12; stroke-width: 10; }
.rp { fill: none; stroke: var(--accent); stroke-width: 10; stroke-linecap: butt; }
.rp-cyan { fill: none; stroke: var(--accent2); stroke-width: 1.5; stroke-linecap: butt; opacity: .4; }

/* ══════════════════════════════
   PHASE 2 — hero scene
══════════════════════════════ */
#phase2 {
  position: fixed;
  inset: 0;
  z-index: 200;
  opacity: 0;
  pointer-events: none;
}

/* nav */
#nav {
  position: absolute;
  top: 0; left: 0; right: 0;
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 22px 44px;
  z-index: 300;
  opacity: 0;
}
.nav-logo {
  font-size: 12px;
  font-weight: 700;
  letter-spacing: .2em;
  text-transform: uppercase;
}
.nav-links {
  display: flex; gap: 36px; list-style: none;
}
.nav-links a {
  font-size: 10px;
  font-weight: 500;
  letter-spacing: .16em;
  text-transform: uppercase;
  color: var(--muted);
  text-decoration: none;
  transition: color .2s;
}
.nav-links a:hover { color: var(--text); }
.nav-cta {
  font-size: 10px;
  font-weight: 600;
  letter-spacing: .14em;
  text-transform: uppercase;
  color: var(--bg);
  background: var(--accent);
  padding: 7px 18px;
  border-radius: 100px;
  text-decoration: none;
}

/* sidebar */
#sidebar-label {
  position: absolute;
  right: -32px;
  top: 50%;
  transform: translateY(-50%) rotate(90deg);
  font-family: 'Space Mono', monospace;
  font-size: 9px;
  letter-spacing: .24em;
  text-transform: uppercase;
  color: var(--muted);
  white-space: nowrap;
  opacity: 0;
}

/* scene (the zoomable container) */
#scene {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
}
#scene-inner {
  position: relative;
  width: 900px; height: 600px;
  transform: scale(2.8);
  transform-origin: center center;
  will-change: transform;
}

/* PCB surface */
#pcb-surface {
  position: absolute;
  inset: -80px;
  background: var(--surface);
  overflow: hidden;
}
/* grid */
#pcb-surface::before {
  content: '';
  position: absolute; inset: 0;
  background-image:
    linear-gradient(var(--grid-line) 1px, transparent 1px),
    linear-gradient(90deg, var(--grid-line) 1px, transparent 1px);
  background-size: 28px 28px;
  opacity: .8;
}
/* ruler */
#pcb-surface::after {
  content: '';
  position: absolute;
  left: 0; top: 0; bottom: 0;
  width: 36px;
  background: #090e07;
  border-right: 1px solid var(--grid-line);
}
#ruler-marks {
  position: absolute;
  left: 0; top: 0; bottom: 0;
  width: 36px;
  z-index: 2;
}
.tick {
  position: absolute;
  left: 22px;
  font-family: 'Space Mono', monospace;
  font-size: 6px;
  color: #2a4022;
  line-height: 1;
}
.tick::before {
  content: '';
  position: absolute;
  right: 100%; top: 50%;
  width: 7px; height: 1px;
  background: #2a4022;
  margin-right: 2px;
}

/* circuit traces on PCB (decorative) */
#pcb-traces {
  position: absolute;
  inset: -80px;
  pointer-events: none;
  z-index: 1;
  opacity: .25;
}

/* selection box */
#selection-box {
  position: absolute;
  top: 50%; left: 50%;
  width: 340px; height: 340px;
  transform: translate(-50%, -50%);
  pointer-events: none;
  z-index: 20;
}
.sel-border {
  position: absolute; inset: 0;
  border: 1.5px dashed var(--handle);
}
.sel-handle {
  position: absolute;
  width: 8px; height: 8px;
  background: var(--handle);
  border-radius: 1px;
  transform: translate(-50%, -50%);
}
.sel-handle.tl{top:0;left:0} .sel-handle.tc{top:0;left:50%} .sel-handle.tr{top:0;left:100%}
.sel-handle.ml{top:50%;left:0} .sel-handle.mr{top:50%;left:100%}
.sel-handle.bl{top:100%;left:0} .sel-handle.bc{top:100%;left:50%} .sel-handle.br{top:100%;left:100%}

/* watch */
#watch-wrap {
  position: absolute;
  top: 50%; left: 50%;
  transform: translate(-50%, -50%);
  width: 300px; height: 300px;
  z-index: 10;
  filter: drop-shadow(0 0 40px rgba(184,255,60,.12)) drop-shadow(0 24px 60px rgba(0,0,0,.9));
}

/* gear animations */
@keyframes spin-cw  { to { transform: rotate(360deg);  } }
@keyframes spin-ccw { to { transform: rotate(-360deg); } }
@keyframes balance-osc { 0%,100%{transform:rotate(22deg)} 50%{transform:rotate(-22deg)} }

.gear-main { animation: spin-cw  14s linear infinite; transform-origin: 150px 150px; }
.gear-b    { animation: spin-ccw  4.6s linear infinite; transform-origin: 218px 112px; }
.gear-c    { animation: spin-cw   7s linear infinite; transform-origin: 90px 200px; }
.gear-d    { animation: spin-ccw  3.2s linear infinite; transform-origin: 225px 195px; }
.balance   { animation: balance-osc 1.4s ease-in-out infinite; transform-origin: 150px 78px; }

/* props */
.prop {
  position: absolute;
  z-index: 5;
  opacity: 0;
}

/* UI overlays */
#ui-brand {
  position: absolute;
  top: 50%; left: 44px;
  transform: translateY(-50%);
  z-index: 300;
  opacity: 0;
  max-width: 340px;
}
.brand-eyebrow {
  font-size: 9px;
  letter-spacing: .22em;
  text-transform: uppercase;
  color: var(--muted);
  margin-bottom: 14px;
}
.brand-name {
  font-size: clamp(48px, 5.5vw, 82px);
  font-weight: 700;
  line-height: 1;
  letter-spacing: -.03em;
  color: var(--text);
  position: relative;
  white-space: nowrap;
}
/* glitch on brand name */
.brand-name::before {
  content: attr(data-text);
  position: absolute;
  left: 2px; top: 0;
  color: var(--accent2);
  clip-path: inset(30% 0 50% 0);
  opacity: .6;
  animation: glitch 8s steps(1) infinite;
}
@keyframes glitch {
  0%,94%,100% { clip-path: inset(100% 0 0 0); transform: translateX(0); }
  95% { clip-path: inset(20% 0 55% 0); transform: translateX(-3px); }
  96% { clip-path: inset(60% 0 20% 0); transform: translateX(3px); }
  97% { clip-path: inset(40% 0 40% 0); transform: translateX(-2px); }
}
.brand-divider {
  width: 28px; height: 1px;
  background: var(--accent-dim);
  margin: 20px 0;
}
.brand-studio {
  font-size: 11px;
  font-weight: 600;
  letter-spacing: .08em;
  text-transform: uppercase;
  color: var(--muted);
  line-height: 1.8;
}
.brand-sub {
  margin-top: 10px;
  font-size: 10px;
  color: #364830;
  letter-spacing: .04em;
  line-height: 1.7;
}

#ui-copy {
  position: absolute;
  top: 50%; right: 56px;
  transform: translateY(-50%);
  max-width: 300px;
  z-index: 300;
  opacity: 0;
}
.copy-label {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 9px;
  letter-spacing: .22em;
  text-transform: uppercase;
  color: var(--accent2);
  margin-bottom: 16px;
}
.copy-label::before {
  content: '';
  width: 16px; height: 1px;
  background: var(--accent2);
}
.copy-headline {
  font-size: 18px;
  font-weight: 400;
  line-height: 1.55;
  color: var(--text);
  margin-bottom: 18px;
}
.copy-headline strong { font-weight: 700; }
.copy-body {
  font-size: 11px;
  color: var(--muted);
  line-height: 1.9;
  letter-spacing: .02em;
}
.copy-stats {
  margin-top: 24px;
  display: flex;
  gap: 24px;
  border-top: 1px solid var(--grid-line);
  padding-top: 16px;
}
.stat-val {
  font-family: 'Space Mono', monospace;
  font-size: 18px;
  font-weight: 700;
  color: var(--accent);
  line-height: 1;
}
.stat-label {
  font-size: 9px;
  color: var(--muted);
  letter-spacing: .1em;
  text-transform: uppercase;
  margin-top: 4px;
}

/* scroll hint */
#scroll-hint {
  position: absolute;
  bottom: 30px;
  left: 50%;
  transform: translateX(-50%);
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 8px;
  z-index: 300;
  opacity: 0;
}
#scroll-hint span {
  font-size: 9px;
  letter-spacing: .24em;
  text-transform: uppercase;
  color: var(--muted);
}
.scroll-line {
  width: 1px; height: 28px;
  background: linear-gradient(to bottom, var(--muted), transparent);
  animation: pulse-line 2s ease-in-out infinite;
}
@keyframes pulse-line {
  0%,100%{opacity:.3;transform:scaleY(1)}
  50%{opacity:1;transform:scaleY(1.25)}
}

/* tool badge (design-app) */
#tool-badge {
  position: absolute;
  top: 22px; right: 22px;
  width: 30px; height: 30px;
  background: var(--handle);
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 10px; font-weight: 700;
  color: #fff;
  font-family: 'Space Mono', monospace;
  z-index: 400;
}

/* system status bottom-left (hero) */
#sys-status {
  position: absolute;
  bottom: 30px; left: 44px;
  z-index: 300;
  opacity: 0;
  font-family: 'Space Mono', monospace;
  font-size: 8px;
  color: var(--accent-dim);
  letter-spacing: .1em;
  line-height: 2;
}
.sys-line { display: flex; align-items: center; gap: 8px; }
.sys-dot {
  width: 5px; height: 5px;
  border-radius: 50%;
  background: var(--accent);
  animation: sys-blink 2s ease-in-out infinite;
}
.sys-dot.cyan { background: var(--accent2); animation-delay: .7s; }
.sys-dot.dim  { background: var(--accent-dim); animation-delay: 1.4s; }
@keyframes sys-blink {
  0%,100%{opacity:1} 50%{opacity:.2}
}

/* cogniti badge */
#logo-badge {
  position: absolute;
  bottom: 20px; right: 22px;
  z-index: 300;
  opacity: 0;
}
.badge-inner {
  background: rgba(12,21,10,.85);
  border: 1px solid var(--grid-line);
  border-radius: 8px;
  padding: 8px 14px;
  display: flex;
  align-items: center;
  gap: 10px;
  backdrop-filter: blur(12px);
}
.badge-icon {
  width: 22px; height: 22px;
  background: var(--accent);
  border-radius: 4px;
  display: flex; align-items: center; justify-content: center;
}
.badge-name {
  font-size: 10px;
  font-weight: 700;
  letter-spacing: .12em;
}
.badge-ver {
  font-size: 8px;
  font-family: 'Space Mono', monospace;
  color: #364830;
  letter-spacing: .1em;
}

/* dot indicator */
#dot-ind {
  position: fixed;
  top: 26px; left: 26px;
  width: 7px; height: 7px;
  background: #fff;
  border-radius: 50%;
  z-index: 9000;
  opacity: .4;
}

/* ════════════════════════════════════════
   RESPONSIVE
════════════════════════════════════════ */

/* ── tablet (640 – 1023px) ── */
@media (max-width: 1023px) {
  /* nav: compact */
  #nav { padding: 16px 24px; }
  .nav-links { gap: 20px; }
  .nav-links a { font-size: 9px; }

  /* brand: tighter */
  #ui-brand { left: 24px; max-width: 280px; }
  .brand-name { font-size: clamp(38px, 4.5vw, 64px); }
  .brand-sub  { display: none; }

  /* copy: hide stats, shrink */
  #ui-copy { right: 24px; max-width: 240px; }
  .copy-stats   { display: none; }
  .copy-headline { font-size: 15px; }
  .copy-body    { display: none; }

  /* hide heavy elements */
  #sys-status   { display: none; }
  #sidebar-label { display: none; }

  /* hide heavier props on tablet */
  #prop-caliper, #prop-pencil { display: none; }
}

/* ── mobile (<640px) ── */
@media (max-width: 639px) {
  /* hide cursor ring — touch device */
  #cursor, #cursor-ring { display: none; }
  body { cursor: auto; }

  /* nav: logo + CTA only */
  .nav-links { display: none; }
  #nav { padding: 14px 20px; }

  /* phase 1 text: scale down */
  .bl { font-size: clamp(44px, 12vw, 72px); }
  #tagline { font-size: 10px; letter-spacing: .22em; }

  /* terminal: bottom-center on mobile */
  #terminal {
    left: 50%; transform: translateX(-50%);
    text-align: center;
    font-size: 8px;
    bottom: 28px;
    white-space: nowrap;
  }

  /* phase 2 layout: stacked */
  #phase2 { display: flex; flex-direction: column; }

  /* brand: top, full width, centered */
  #ui-brand {
    position: absolute;
    top: 64px; left: 0; right: 0;
    transform: none;
    text-align: center;
    max-width: 100%;
    padding: 0 20px;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  .brand-name {
    font-size: clamp(40px, 13vw, 72px);
    white-space: nowrap;
  }
  .brand-divider { margin: 12px auto; }
  .brand-studio  { font-size: 10px; text-align: center; }
  .brand-sub     { display: none; }
  .brand-name::before { display: none; } /* disable glitch on mobile */

  /* scene: push down, cover middle portion */
  #scene {
    top: 200px;
    bottom: 120px;
  }

  /* copy: bottom strip */
  #ui-copy {
    position: absolute;
    top: auto;
    bottom: 50px;
    right: 0; left: 0;
    transform: none;
    max-width: 100%;
    padding: 0 24px;
    text-align: center;
    border-top: 1px solid var(--grid-line);
    padding-top: 12px;
  }
  .copy-label, .copy-body, .copy-stats { display: none; }
  .copy-headline {
    font-size: 13px;
    line-height: 1.5;
    color: var(--muted);
    font-weight: 400;
  }
  .copy-headline strong { color: var(--text); font-weight: 600; }

  /* hide non-essential */
  #sys-status    { display: none; }
  #sidebar-label { display: none; }
  #tool-badge    { display: none; }
  #dot-ind       { display: none; }
  #logo-badge    { bottom: 10px; right: 12px; }
  .badge-ver     { display: none; }

  /* props: hide all on mobile */
  .prop { display: none !important; }

  /* scroll hint: reposition */
  #scroll-hint {
    bottom: 16px;
    display: none; /* too cluttered on mobile */
  }
}

/* ── very small (<375px) ── */
@media (max-width: 374px) {
  .brand-name { font-size: 10vw; }
  .bl         { font-size: 10vw; }
  #scene      { top: 180px; }
}

/* ══════════════════════════════
   MANIFESTO — section 2
══════════════════════════════ */
#manifesto {
  position: fixed;
  inset: 0;
  z-index: 250;
  pointer-events: none;
}

#manifesto-label {
  position: fixed;
  top: 0; left: 0;
  font-size: clamp(56px, 9vw, 140px);
  font-weight: 200;
  letter-spacing: .05em;
  text-transform: uppercase;
  color: var(--text);
  opacity: 0;
  pointer-events: none;
  z-index: 260;
  white-space: nowrap;
}

.m-beat {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  will-change: opacity;
}

/* left column — large display text */
.m-left {
  position: absolute;
  left: 5vw;
  width: 26vw;
  max-width: 380px;
  font-size: clamp(16px, 2.2vw, 36px);
  font-weight: 300;
  color: var(--muted);
  line-height: 1.2;
  letter-spacing: -.025em;
  text-transform: uppercase;
  opacity: 0;
  will-change: transform, opacity;
}
.m-l-bold {
  font-weight: 700;
  font-size: clamp(20px, 2.8vw, 46px);
  color: var(--text);
}
.m-l-sm {
  font-size: clamp(12px, 1.4vw, 22px);
  text-transform: none;
  line-height: 1.6;
  letter-spacing: -.01em;
}

/* right column — body / punch text */
.m-right {
  position: absolute;
  right: 5vw;
  width: 24vw;
  max-width: 320px;
  font-size: clamp(13px, 1.3vw, 20px);
  font-weight: 300;
  color: var(--text);
  line-height: 1.75;
  letter-spacing: .01em;
  opacity: 0;
  will-change: transform, opacity;
}
.m-r-punch {
  font-size: clamp(22px, 3.2vw, 52px);
  font-weight: 700;
  color: var(--accent);
  line-height: 1.1;
  letter-spacing: -.04em;
}
.m-r-em em {
  font-style: normal;
  color: var(--accent);
  font-weight: 600;
}
.m-r-stack {
  display: flex;
  flex-direction: column;
  gap: .35em;
}
.m-r-stack span {
  font-size: clamp(12px, 1.4vw, 22px);
  font-weight: 300;
  color: var(--muted);
  display: block;
}
.m-climax {
  font-weight: 600;
  color: var(--accent);
  font-size: clamp(18px, 2.6vw, 42px);
  letter-spacing: -.03em;
}

/* ── tablet (640–1023px) ── */
@media (max-width: 1023px) {
  .m-left   { width: 30vw; left: 3vw; }
  .m-right  { width: 28vw; right: 3vw; }
  .m-l-bold { font-size: clamp(18px, 2.5vw, 40px); }
  .m-l-sm   { font-size: clamp(11px, 1.3vw, 20px); }
  #manifesto-label { font-size: clamp(48px, 7.5vw, 110px); }
}

/* ── mobile (<640px): stack text at bottom, watch visible in center ── */
@media (max-width: 639px) {
  .m-left {
    top: auto; bottom: 30vh;
    left: 6vw; right: auto;
    width: 56vw;
    font-size: clamp(15px, 4.8vw, 26px);
  }
  .m-right {
    top: auto; bottom: 10vh;
    right: 6vw; left: auto;
    width: 52vw;
    font-size: clamp(12px, 3.8vw, 18px);
  }

}

}

}

/* ══════════════════════════════
   SECTION 4 — THE SHIFT
══════════════════════════════ */
#shift-canvas {
  position: fixed; inset: 0;
  z-index: 2; opacity: 0; pointer-events: none;
}
#shift-label {
  position: fixed; top: 50px; left: 46px;
  font-family: 'Space Mono', monospace;
  font-size: 11px; letter-spacing: .22em;
  color: var(--accent); z-index: 50; opacity: 0;
  text-transform: uppercase; pointer-events: none;
}
#shift-hud {
  position: fixed; right: 52px; top: 50%;
  transform: translateY(-50%);
  z-index: 50; opacity: 0; pointer-events: none;
}
#shift-pipe {
  position: relative; height: 260px; width: 120px;
  display: flex; flex-direction: column; align-items: flex-start;
}
.sp-track {
  position: absolute; top: 0; bottom: 0; left: 4px;
  width: 1px; background: var(--grid-line);
}
.sp-fill {
  position: absolute; top: 0; left: 4px;
  width: 1px; height: 0%;
  background: var(--accent);
  transition: height .04s linear;
}
.sp-node {
  position: absolute; left: 0;
  display: flex; align-items: center; gap: 12px;
  cursor: default;
}
.sp-dot {
  width: 9px; height: 9px; border-radius: 50%;
  border: 1px solid var(--muted); background: var(--bg);
  flex-shrink: 0;
  transition: border-color .35s, background .35s, box-shadow .35s;
}
.sp-node.active .sp-dot {
  border-color: var(--accent); background: var(--accent);
  box-shadow: 0 0 14px var(--accent);
}
.sp-node.done .sp-dot {
  border-color: var(--accent-dim); background: var(--accent-dim);
}
.sp-lbl {
  font-family: 'Space Mono', monospace;
  font-size: 8px; letter-spacing: .14em;
  color: var(--muted); text-transform: uppercase;
  white-space: nowrap;
  transition: color .35s;
}
.sp-node.active .sp-lbl { color: var(--accent); }

#shift-content { position: fixed; inset: 0; z-index: 50; pointer-events: none; opacity: 0; }
.sc-stage {
  position: absolute; bottom: 80px; left: 7vw;
  opacity: 0; pointer-events: none;
  will-change: transform, opacity;
}
.sc-eyebrow {
  font-family: 'Space Mono', monospace;
  font-size: 10px; letter-spacing: .28em;
  color: var(--accent); margin-bottom: 18px;
  text-transform: uppercase;
}
.sc-headline {
  font-size: clamp(36px, 5.8vw, 76px);
  font-weight: 300; line-height: 1.08;
  color: var(--text); margin-bottom: 22px;
  letter-spacing: -.025em;
}
.sc-body {
  font-size: 13px; font-weight: 300;
  line-height: 1.9; color: var(--muted);
  max-width: 400px;
}
