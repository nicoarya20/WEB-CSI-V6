<!-- ══ SECTION 6 — SELECTED DEPLOYMENTS ══ -->

<!-- nav hint shown inside Section 5 — scroll-triggered -->
<div id="sd-nav">
  <div class="sd-nav-label">Scroll to continue</div>
  <div class="sd-nav-arrow">↓</div>
  <div id="sd-nav-progress"><div id="sd-nav-progress-fill"></div></div>
</div>

<canvas id="sd-canvas"></canvas>

<div id="sd-section-label">
  <span class="sd-sl-num">06</span>
  <span class="sd-sl-sep">/</span>
  <span class="sd-sl-title">Selected Deployments</span>
</div>

<div id="sd-categories"></div>

<div id="sd-copy">
  <div class="sd-copy-num" id="sd-copy-num">01 / 05</div>
  <div class="sd-copy-name" id="sd-copy-name">Public Services</div>
  <div class="sd-copy-bar"></div>
  <div class="sd-copy-body" id="sd-copy-body"></div>
  <div class="sd-copy-region" id="sd-copy-region">Indonesia</div>
</div>

<div id="sd-headline-block">
  <div id="sd-headline">In The Field.</div>
  <div id="sd-subline">Five environments where Cogniti is operational.<br>Not demos — live systems making real decisions.</div>
</div>

  <span class="sd-sb-item" id="sd-sb-env">ENVIRONMENT 1 / 5</span>
  <span class="sd-sb-sep">·</span>

</div>

  <div class="sd-back-row">
    <span class="sd-back-icon">←</span>
    <span class="sd-back-label">Architecture</span>
  </div>
  <div id="sd-back-progress"><div id="sd-back-progress-fill"></div></div>
</div>

<!-- SD transition overlay -->
<div id="sd-tx-overlay">
  <div class="sd-tx-num">06</div>
  <div class="sd-tx-rule"></div>
  <div class="sd-tx-title-wrap"><div class="sd-tx-word">Selected</div></div>
  <div class="sd-tx-title-wrap"><div class="sd-tx-word">Deployments</div></div>
  <div class="sd-tx-sub">In the field. Not demos.</div>
  <div class="sd-tx-prog-wrap"><div class="sd-tx-prog"></div></div>
</div>
<div id="sd-flash"></div>

<script type="module">
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass }     from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';

/* ── category data ── */
const CATS = [
  {
    name: 'Public Services', num: '01', region: 'Indonesia',
    body: 'Government agencies manage at scale and decide under pressure. We embed inside those environments — connecting citizen data, operational visibility, and coordination workflows so institutions move from knowing to acting.'
  },
  {
    name: 'Infrastructure', num: '02', region: 'Indonesia',
    body: "Critical systems don't fail loudly — they degrade quietly until something breaks. We connect the signals operators miss: asset status, environmental conditions, operational patterns. Awareness before incidents."
  },
  {
    name: 'Logistics', num: '03', region: 'International',
    body: "Every shipment is a sequence of decisions. We sit at the routing layer — where exceptions stack, visibility drops, and delays compound. Not another dashboard. Intelligence that moves with the load."
  },
  {
    name: 'Hospitality', num: '04', region: 'Southeast Asia',
    body: "Guests don't say what they need. We help teams read the patterns early — service signals, engagement gaps, moments before friction becomes feedback."
  },
  {
    name: 'Communities', num: '05', region: 'Indonesia',
    body: "More channels made coordination harder, not easier. We help communities hear what's actually being said, find where engagement lives, and act before signal turns to noise."
  },
];

/* ── state ── */
let _sdInit = false, _sdVisible = false;
let fromCat = 0, toCat = 0, morphT = 1.0;

/* ── build category tabs ── */
const catEl = document.getElementById('sd-categories');
CATS.forEach((c, i) => {
  const el = document.createElement('div');
  el.className = 'sd-cat-item' + (i === 0 ? ' active' : '');
  el.innerHTML = `<div class="sd-cat-dot"></div><div class="sd-cat-name">${c.name}</div>`;
  el.addEventListener('click', () => goToCategory(i));
  catEl.appendChild(el);
});

/* ── renderer ── */
const cvs = document.getElementById('sd-canvas');
const renderer = new THREE.WebGLRenderer({ canvas: cvs, antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.1;

const scene = new THREE.Scene();
scene.background = new THREE.Color('#060807');

const cam = new THREE.PerspectiveCamera(40, window.innerWidth / window.innerHeight, 0.1, 200);
cam.position.set(0, 15, 13);
cam.lookAt(0, 0, 0);

/* ── terrain geometry ── */
const SEG = 90, SZ = 18;
const geo = new THREE.PlaneGeometry(SZ, SZ, SEG, SEG);
geo.rotateX(-Math.PI / 2);   // flat on XZ plane, Y = height

const pos = geo.attributes.position;
const N   = pos.count;

// normalized XZ coords per vertex (after rotation)
const VX = new Float32Array(N);
const VZ = new Float32Array(N);
for (let i = 0; i < N; i++) {
  VX[i] = pos.getX(i) / (SZ * 0.5);
  VZ[i] = pos.getZ(i) / (SZ * 0.5);
}

/* ── 5 height maps ── */
const HEIGHTS = Array.from({ length: 5 }, () => new Float32Array(N));
for (let i = 0; i < N; i++) {
  const x = VX[i], z = VZ[i];

  // H0 Public Services — stepped plateaus (quantized waves)
  const r0 = 0.65 * Math.sin(x * Math.PI * 1.9) * Math.cos(z * Math.PI * 1.6)
            + 0.30 * Math.sin(x * Math.PI * 4.2 + z * Math.PI * 3.1);
  HEIGHTS[0][i] = Math.round(r0 * 5) / 5 * 2.6;

  // H1 Infrastructure — sharp grid spikes
  const gx = Math.abs(Math.cos(x * Math.PI * 5));
  const gz = Math.abs(Math.cos(z * Math.PI * 5));
  HEIGHTS[1][i] = Math.pow(gx * gz, 7) * 5.8 + 0.1 * Math.sin(x * 2.5 + z * 1.8);

  // H2 Logistics — diagonal flow ridges
  const ch1 = 2.4 * Math.exp(-Math.pow((x + z * 0.55 + 0.15) * 4.2, 2));
  const ch2 = 1.9 * Math.exp(-Math.pow((x - z * 0.45 - 0.40) * 3.6, 2));
  const ch3 = 2.1 * Math.exp(-Math.pow((x * 0.5 - z + 0.25) * 3.9, 2));
  HEIGHTS[2][i] = ch1 + ch2 + ch3;

  // H3 Hospitality — gentle dome clusters
  const hC = [[-0.42,-0.28],[0.38,0.44],[-0.12,0.56],[0.52,-0.22],[0.02,0.08]];
  HEIGHTS[3][i] = hC.reduce((s, [cx,cz]) =>
    s + 2.3 * Math.exp(-((x-cx)**2 + (z-cz)**2) * 8.5), 0);

  // H4 Communities — distributed organic hills
  const cC = [[-0.68,0.10],[0.06,-0.63],[0.62,0.17],[-0.24,0.66],[0.44,-0.50],[-0.52,-0.38],[0.18,0.72]];
  HEIGHTS[4][i] = cC.reduce((s, [cx,cz], j) =>
    s + (0.9 + j * 0.13) * Math.exp(-((x-cx)**2 + (z-cz)**2) * 13), 0);
}

/* ── vertex color attribute ── */
const colAttr = new THREE.BufferAttribute(new Float32Array(N * 3), 3);
geo.setAttribute('color', colAttr);

const LOW_C  = new THREE.Color('#0b1e12');
const HIGH_C = new THREE.Color('#b8ff3c');
const tmpC   = new THREE.Color();

function updateColors() {
  const arr = colAttr.array;
  for (let i = 0; i < N; i++) {
    const t = Math.pow(Math.min(1, Math.max(0, pos.getY(i) / 3.8)), 1.4);
    tmpC.lerpColors(LOW_C, HIGH_C, t);
    arr[i*3] = tmpC.r; arr[i*3+1] = tmpC.g; arr[i*3+2] = tmpC.b;
  }
  colAttr.needsUpdate = true;
}

/* ── terrain meshes (share geometry) ── */
const solidMesh = new THREE.Mesh(geo,
  new THREE.MeshBasicMaterial({ vertexColors: true, side: THREE.DoubleSide }));
scene.add(solidMesh);

const wireMesh = new THREE.Mesh(geo,
  new THREE.MeshBasicMaterial({ color: '#b8ff3c', wireframe: true, transparent: true, opacity: 0.05 }));
scene.add(wireMesh);

/* ── deployment pins ── */
const PIN_DEFS = [
  [[-0.30,-0.10],[0.42,0.22],[-0.52,0.40],[0.10,-0.56]],
  [[0.02,0.02],[0.50,0.50],[-0.50,0.50],[0.50,-0.50],[-0.50,-0.50]],
  [[-0.62,-0.32],[-0.12,0.08],[0.32,0.34],[0.68,0.58]],
  [[-0.42,-0.28],[0.38,0.44],[-0.12,0.56],[0.52,-0.22]],
  [[-0.68,0.10],[0.06,-0.63],[0.62,0.17],[-0.24,0.66],[0.44,-0.50],[-0.52,-0.38]],
];

const pinGeo = new THREE.SphereGeometry(0.1, 8, 8);
const pinMat = new THREE.MeshBasicMaterial({ color: '#b8ff3c' });
const pinCount = 6;
const pins      = Array.from({ length: pinCount }, () => {
  const m = new THREE.Mesh(pinGeo, pinMat); m.visible = false; scene.add(m); return m;
});
const pinLights = Array.from({ length: pinCount }, () => {
  const l = new THREE.PointLight('#b8ff3c', 0, 4, 2); scene.add(l); return l;
});

function placePins(catIdx) {
  const defs = PIN_DEFS[catIdx];
  pins.forEach((m, i) => { m.visible = i < defs.length; pinLights[i].intensity = 0; });
  defs.forEach(([xn, zn], i) => {
    let bi = 0, bd = 1e9;
    for (let v = 0; v < N; v++) {
      const d = (VX[v]-xn)**2 + (VZ[v]-zn)**2;
      if (d < bd) { bd = d; bi = v; }
    }
    const py = HEIGHTS[catIdx][bi] + 0.3;
    pins[i].position.set(xn * SZ * 0.5, py, zn * SZ * 0.5);
    pins[i].scale.setScalar(0);
    pinLights[i].position.set(xn * SZ * 0.5, py, zn * SZ * 0.5);
    gsap.to(pins[i].scale,  { x:1,y:1,z:1,  duration:.5, delay:i*.12+.35, ease:'back.out(2)' });
    gsap.to(pinLights[i],   { intensity:1.8, duration:.5, delay:i*.12+.35 });
  });
}

/* ── post-processing ── */
const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, cam));
composer.addPass(new UnrealBloomPass(
  new THREE.Vector2(window.innerWidth, window.innerHeight), 0.7, 0.5, 0.8));

/* ── category switch ── */
function goToCategory(idx) {
  if (idx === toCat) return;
  fromCat = toCat; toCat = idx; morphT = 0;
  const tw = { t: 0 };
  gsap.to(tw, { t: 1, duration: 1.6, ease: 'power3.inOut', onUpdate() { morphT = tw.t; } });

  document.querySelectorAll('.sd-cat-item').forEach((el, i) =>
    el.classList.toggle('active', i === idx));

  gsap.to('#sd-copy', { opacity:0, x:12, duration:.3, ease:'power2.in',
    onComplete() {
      const c = CATS[idx];
      document.getElementById('sd-copy-num').textContent    = `${c.num} / 05`;
      document.getElementById('sd-copy-name').textContent   = c.name;
      document.getElementById('sd-copy-body').textContent   = c.body;
      document.getElementById('sd-copy-region').textContent = c.region;
      document.getElementById('sd-sb-env').textContent      = `ENVIRONMENT ${idx+1} / 5`;
      // Guard: only fade in if SD is still visible (user may have scrolled back to §5)
      if (_sdVisible) gsap.to('#sd-copy', { opacity:1, x:0, duration:.5, ease:'power2.out' });
    }
  });

  setTimeout(() => placePins(idx), 500);
}

/* ── animation loop ── */
const clock = new THREE.Clock();
function animate() {
  requestAnimationFrame(animate);
  const t   = clock.getElapsedTime();
  const hF  = HEIGHTS[fromCat], hT = HEIGHTS[toCat], mt = morphT;

  for (let i = 0; i < N; i++) pos.setY(i, hF[i] * (1-mt) + hT[i] * mt);
  pos.needsUpdate = true;
  updateColors();

  cam.position.x = Math.sin(t * 0.035) * 4;
  cam.position.z = 13 + Math.cos(t * 0.028) * 2;
  cam.lookAt(0, 0, 0);

  pins.forEach((m, i) => {
    if (!m.visible) return;
    m.position.y += Math.sin(t * 1.5 + i * 1.1) * 0.0025;
    pinLights[i].position.y = m.position.y;
  });

  composer.render();
}

/* ── reveal / conceal SD ── */
function revealSD() {
  if (_sdVisible) return;
  _sdVisible = true;
  /* _sdActive + overflow already locked in laToSD() */

  if (!_sdInit) {
    _sdInit = true;
    const c = CATS[0];
    document.getElementById('sd-copy-num').textContent    = '01 / 05';
    document.getElementById('sd-copy-name').textContent   = c.name;
    document.getElementById('sd-copy-body').textContent   = c.body;
    document.getElementById('sd-copy-region').textContent = c.region;
    placePins(0);
    animate();
  }

  cvs.classList.add('active');
  gsap.set('#sd-copy', { x: 20 });
  gsap.to(cvs,                { opacity:1, duration:.5, ease:'power2.out' });
  gsap.to('#sd-section-label',{ opacity:1, y:0,  duration:.8, delay:.3, ease:'power2.out' });
  gsap.to('#sd-categories',   { opacity:1,       duration:.8, delay:.4  });
  gsap.to('#sd-copy',         { opacity:1, x:0,  duration:.8, delay:.5, ease:'power3.out' });
  gsap.to('#sd-headline-block',{ opacity:1,       duration:.7, delay:.7  });
  gsap.to('#sd-statusbar',    { opacity:1,        duration:.6, delay:1.0 });
  gsap.to('#sd-back',         { opacity:1,        duration:.6, delay:.6,
    onComplete() { document.getElementById('sd-back').classList.add('visible'); }
  });
  document.getElementById('sd-categories').classList.add('active');
}

function concealSD() {
  if (!_sdVisible) return;
  _sdVisible = false;
  window._sdActive = false;                   // release lock on main scroll listener
  document.body.style.overflow = '';          // restore page scroll
  // Kill any pending goToCategory() tween on #sd-copy before fading out,
  // so its onComplete can't race and set opacity back to 1.
  gsap.killTweensOf('#sd-copy');
  gsap.to(['#sd-canvas','#sd-section-label','#sd-categories','#sd-copy',
           '#sd-headline-block','#sd-statusbar','#sd-back'],
    { opacity:0, duration:.4, ease:'power2.in', overwrite: true });
  cvs.classList.remove('active');
  document.getElementById('sd-categories').classList.remove('active');
  /* reset scroll state */
  _sdBackAcc = 0; _sdBackLock = false;
  _sdCatAcc  = 0; _sdCatLock  = false;
  if (document.getElementById('sd-back-progress-fill'))
    document.getElementById('sd-back-progress-fill').style.width = '0%';
}

window.revealSD  = revealSD;
window.concealSD = concealSD;

/* ── SD transition overlay ── */
function triggerTransitionSD() {
  const ov = document.getElementById('sd-tx-overlay');
  if (ov.classList.contains('active')) return;
  ov.classList.add('active');

  gsap.set('.sd-tx-word',  { y: '100%' });
  gsap.set(['.sd-tx-num','.sd-tx-sub'], { opacity:0, y:10 });
  gsap.set('.sd-tx-rule',  { scaleX: 0 });
  gsap.set('.sd-tx-prog',  { scaleX: 0 });

  gsap.timeline({
    onComplete() {
      gsap.to('#sd-flash', { opacity:1, duration:.2, ease:'power2.in',
        onComplete() {
          revealSD();
          gsap.to(['#sd-tx-overlay','#sd-flash'], { opacity:0, duration:.5, ease:'power2.out',
            onComplete() { ov.classList.remove('active'); ov.style.pointerEvents = 'none'; }
          });
        }
      });
    }
  })
  .to(ov,            { opacity:1,         duration:.3 })
  .to('.sd-tx-num',  { opacity:1, y:0,    duration:.4 }, '+=.1')
  .to('.sd-tx-rule', { scaleX:1,          duration:.6, ease:'power2.out' }, '-=.2')
  .to('.sd-tx-word', { y:'0%', stagger:.14, duration:.8, ease:'power3.out' }, '-=.3')
  .to('.sd-tx-sub',  { opacity:1, y:0,    duration:.4 }, '-=.3')
  .to('.sd-tx-prog', { scaleX:1,          duration:.8, ease:'power2.inOut' }, '-=.6');
}

/* ── bidirectional scroll: Section 5 ↔ Section 6 ── */
const SD_THRESHOLD  = 500; // px scroll to enter/exit section (higher = less accidental)
const CAT_THRESHOLD = 160; // px to switch one category
let _sdScrollAcc  = 0, _sdScrollLock = false;
let _sdBackAcc    = 0, _sdBackLock   = false;
let _sdCatAcc     = 0, _sdCatLock    = false;
let _sdFwdAcc     = 0;

function laToSD() {
  if (_sdScrollLock) return;
  _sdScrollLock = true;
  window._sdActive = true;             // lock immediately — before overlay even starts
  document.body.style.overflow = 'hidden';
  gsap.to('#sd-nav', { opacity:0, duration:.3 });
  const laCvs = document.getElementById('la-canvas');
  gsap.to([laCvs,'#la-section-label','#la-text-block','#la-statusbar'], {
    opacity:0, duration:.35,
    onComplete() { laCvs.classList.remove('active'); }
  });
  setTimeout(triggerTransitionSD, 250);
}

function sdToLA() {
  if (_sdBackLock) return;
  _sdBackLock = true;
  concealSD();                                    // restores overflow + _sdActive=false
  if (typeof window.setLaVisible === 'function') window.setLaVisible(false); // allow revealLA guard to pass
  if (typeof window.revealLA     === 'function') window.revealLA();          // single source: canvas + text + hides shift
  showSdNav(.8);
}

window.addEventListener('wheel', (e) => {
  /* Section 5 → scroll down → Section 6 */
  if (document.getElementById('la-canvas').classList.contains('active')) {
    if (_sdScrollLock) return;
    if (e.deltaY > 0) {
      _sdScrollAcc = Math.min(_sdScrollAcc + e.deltaY, SD_THRESHOLD);
      document.getElementById('sd-nav-progress-fill').style.width =
        (_sdScrollAcc / SD_THRESHOLD * 100) + '%';
      if (_sdScrollAcc >= SD_THRESHOLD) laToSD();
    } else {
      _sdScrollAcc = Math.max(0, _sdScrollAcc + e.deltaY);
      document.getElementById('sd-nav-progress-fill').style.width =
        (_sdScrollAcc / SD_THRESHOLD * 100) + '%';
    }
    return;
  }
  /* Section 6 — scroll navigates categories; up at first cat → back to Section 5 */
  if (_sdVisible && !_sdBackLock) {
    if (e.deltaY > 0) {
      /* scroll down → next category */
      _sdBackAcc = 0;
      document.getElementById('sd-back-progress-fill').style.width = '0%';
      if (toCat < CATS.length - 1 && !_sdCatLock) {
        _sdFwdAcc = 0;
        const _pf0 = document.getElementById('phil-nav-fill');
        if (_pf0) _pf0.style.width = '0%';
        _sdCatAcc += e.deltaY;
        if (_sdCatAcc >= CAT_THRESHOLD) {
          _sdCatAcc = 0;
          _sdCatLock = true;
          goToCategory(toCat + 1);
          setTimeout(() => { _sdCatLock = false; _sdCatAcc = 0; }, 1300);
        }
      } else if (toCat === CATS.length - 1) {
        /* at last category — accumulate toward Philosophy */
        _sdCatAcc = 0;
        _sdFwdAcc = Math.min(_sdFwdAcc + e.deltaY, SD_THRESHOLD);
        const _pf1 = document.getElementById('phil-nav-fill');
        if (_pf1) _pf1.style.width = (_sdFwdAcc / SD_THRESHOLD * 100) + '%';
        const _pn = document.getElementById('phil-nav');
        if (_pn && !_pn.classList.contains('visible')) {
          _pn.classList.add('visible');
          gsap.to('#phil-nav', { opacity:1, duration:.6, ease:'power2.out' });
        }
        if (_sdFwdAcc >= SD_THRESHOLD && typeof window.sdToPhil === 'function') {
          _sdFwdAcc = 0;
          window.sdToPhil();
        }
      }
    } else if (e.deltaY < 0) {
      /* scroll up */
      _sdFwdAcc = 0;
      const _pf2 = document.getElementById('phil-nav-fill');
      if (_pf2) _pf2.style.width = '0%';
      if (toCat > 0 && !_sdCatLock) {
        /* previous category */
        _sdBackAcc = 0;
        document.getElementById('sd-back-progress-fill').style.width = '0%';
        _sdCatAcc += e.deltaY;
        if (_sdCatAcc <= -CAT_THRESHOLD) {
          _sdCatAcc = 0;
          _sdCatLock = true;
          goToCategory(toCat - 1);
          setTimeout(() => { _sdCatLock = false; _sdCatAcc = 0; }, 1300);
        }
      } else if (toCat === 0) {
        /* at first category → accumulate back to Section 5 */
        _sdCatAcc = 0;
        _sdBackAcc = Math.min(_sdBackAcc + Math.abs(e.deltaY), SD_THRESHOLD);
        document.getElementById('sd-back-progress-fill').style.width =
          (_sdBackAcc / SD_THRESHOLD * 100) + '%';
        if (_sdBackAcc >= SD_THRESHOLD) sdToLA();
      }
    }
  }
}, { passive: true });



/* ── watch for LA canvas becoming active → show sd-nav ── */
function showSdNav(delay) {
  const sdNav = document.getElementById('sd-nav');
  if (sdNav.classList.contains('visible')) return;
  sdNav.classList.add('visible');
  _sdScrollAcc  = 0; // reset accumulator
  _sdScrollLock = false;
  document.getElementById('sd-nav-progress-fill').style.width = '0%';
  gsap.to(sdNav, { opacity:1, duration:.8, delay: delay ?? 2.0, ease:'power2.out' });
}
const obs = new MutationObserver(() => {
  if (document.getElementById('la-canvas').classList.contains('active')) {
    showSdNav(2.0);
    obs.disconnect();
  }
});
obs.observe(document.getElementById('la-canvas'), { attributes:true, attributeFilter:['class'] });
/* fallback: already active when module loads */
if (document.getElementById('la-canvas').classList.contains('active')) showSdNav(0.5);

/* ── resize ── */
window.addEventListener('resize', () => {
  const w = window.innerWidth, h = window.innerHeight;
  cam.aspect = w / h; cam.updateProjectionMatrix();
  renderer.setSize(w, h); composer.setSize(w, h);
});
</script>
